<div class="gate-container">
  <div class="gate-card">
    <span class="gate-hearts">♥ ♥</span>
    <h1 class="gate-title">Hilary's List</h1>
    <p class="gate-subtitle">a coffee shop journal</p>

    <div class="gate-form">
      <input
        type="password"
        class="gate-input"
        placeholder="Enter password"
        [(ngModel)]="password"
        (keyup.enter)="onSubmit()"
      />

      @if (error) {
        <p class="gate-error">Wrong password, try again</p>
      }

      <button class="gate-btn" (click)="onSubmit()">Enter</button>
    </div>
  </div>
</div>
